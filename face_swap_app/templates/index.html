<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Face Swap</title>
</head>
<body>
    <h1>Upload Two Faces to Swap</h1>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
      {% for msg in messages %}<li style="color: red;">{{ msg }}</li>{% endfor %}
    </ul>
  {% endif %}
{% endwith %}
    <form method="POST" enctype="multipart/form-data">
        <label for="image1">Image 1:</label><br>
        <input type="file" id="image1" name="image1" accept=".png,.jpg,.jpeg,.bmp,.webp" required><br><br>
        <label for="image2">Image 2:</label><br>
        <input type="file" id="image2" name="image2" accept=".png,.jpg,.jpeg,.bmp,.webp" required><br><br>
        <input type="submit" value="Swap Faces">
    </form>

    {% if result_image %}
        <h2>Result</h2>
        <img src="{{ url_for('static', filename=result_image) }}" width="400" style="max-width: 100%; height: auto;" alt="Face swap result">
        <br>
        <a href="{{ url_for('static', filename=result_image) }}" download="face-swap.jpg">Download result</a>
    {% endif %}
</body>
</html>
